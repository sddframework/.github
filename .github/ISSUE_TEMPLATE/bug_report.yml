name: Bug report
description: Report a reproducible problem in this repository.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve SDDFW. The framework is in early development;
        report a problem with something that exists in this repository.
        Do not include credentials or private information.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How can we reproduce it?
      description: Include steps, a relevant file or URL, and a minimal example when useful.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and environment
      description: Include the commit or version and relevant browser, operating system, or tool versions.
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Add screenshots or redacted output. State which checks were actually run.
